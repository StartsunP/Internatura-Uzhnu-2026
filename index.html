<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="30">
<title>Технічні роботи · Інтернатура УжНУ</title>
<style>
  :root { --moss:#3a7a56; --moss-dark:#2f6d4f; --gold:#b8893f; --bg:#f6f3ec; --card:#fffdf8; --ink:#2a2620; --muted:#7a7266; --line:#e8e0d2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:20px; min-height:100vh; }
  .box { max-width:460px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 40px rgba(58,122,86,0.10); padding:40px 30px; text-align:center; }
  .ic { font-size:3.4rem; line-height:1; margin-bottom:18px; }
  h1 { font-size:1.4rem; font-weight:800; letter-spacing:-0.01em; margin-bottom:12px; color:var(--moss-dark); }
  p { font-size:0.98rem; line-height:1.6; color:var(--muted); margin-bottom:10px; }
  .accent { color:var(--gold); font-weight:700; }
  .spinner { display:inline-block; width:34px; height:34px; border:3.5px solid var(--line); border-top-color:var(--moss); border-radius:50%; animation:spin 0.9s linear infinite; margin:22px auto 6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .foot { margin-top:22px; font-size:0.82rem; color:var(--muted); }
  .foot a { color:var(--moss-dark); font-weight:700; text-decoration:none; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1814; --card:#242019; --ink:#ece5d8; --muted:#a49a89; --line:#38322a; }
    body { background:var(--bg); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🛠️</div>
    <h1>Сайт на технічних роботах</h1>
    <p>Оновлюємо систему розподілу. Це <span class="accent">ненадовго</span> — повернемось за кілька хвилин.</p>
    <div class="spinner"></div>
    <p style="font-size:0.86rem; margin-top:10px;">Сторінка оновиться автоматично. Або оновіть її вручну трохи згодом.</p>
    <div class="foot">Питання? <a href="https://t.me/Syrochok" target="_blank" rel="noopener">✈️ Напишіть адміну @Syrochok</a></div>
  </div>
</body>
</html>
